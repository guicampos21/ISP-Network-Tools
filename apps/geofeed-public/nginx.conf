server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;
    charset utf-8;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    location = / {
        try_files /index.html =404;
        limit_except GET { deny all; }
    }

    location = /feed.html {
        try_files /feed.html =404;
        limit_except GET { deny all; }
    }

    location = /geofeed-manifest.json {
        root /usr/share/nginx/blocos;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
        limit_except GET { deny all; }
    }

    location ~ "^/[a-z0-9][a-z0-9._-]+\.csv$" {
        root /usr/share/nginx/blocos;
        default_type application/geofeed+csv;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
        limit_except GET { deny all; }
    }

    location ~ "^/[a-z0-9][a-z0-9._-]+\.html$" {
        try_files /feed.html =404;
        limit_except GET { deny all; }
    }

    location / {
        try_files $uri =404;
        limit_except GET { deny all; }
    }
}
