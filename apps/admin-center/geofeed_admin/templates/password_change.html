{% extends "base.html" %}
{% block title %}Definir senha{% endblock %}
{% block content %}
<section class="card form-card auth-card"><p class="eyebrow">Primeiro acesso</p><h1>Defina sua senha</h1><p class="muted">Por segurança, substitua a senha temporária antes de continuar.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label><span>Nova senha *</span><input type="password" name="password" required minlength="12" autocomplete="new-password"></label><label><span>Confirmar senha *</span><input type="password" name="password_confirm" required minlength="12" autocomplete="new-password"></label><p class="form-note">Use pelo menos 12 caracteres, incluindo maiúscula, minúscula, número e símbolo.</p><button class="button button-primary" type="submit">Salvar senha</button></form></section>
{% endblock %}
