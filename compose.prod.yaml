services:
  postgres:
    restart: always
  redis:
    restart: always
  admin-center:
    restart: always
    environment:
      APP_ENV: production
      DEV_AUTH: "false"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
  admin-center-worker:
    restart: always
    environment:
      APP_ENV: production
      DEV_AUTH: "false"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
  geofeed-public:
    restart: always
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
  isp-network-health:
    restart: always
    environment:
      APP_ENV: production
      DEV_AUTH: "false"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
  isp-network-health-worker:
    restart: always
    environment:
      APP_ENV: production
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
