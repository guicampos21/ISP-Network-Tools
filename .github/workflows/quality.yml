name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q apps/admin-center/geofeed_admin apps/isp-network-health/src apps/isp-network-health/isp_health
      - name: Secret scan
        run: ./scripts/secret-check.sh
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Admin Center tests
        run: PYTHONPATH=apps/admin-center:packages pytest -q apps/admin-center/tests
      - name: INH tests
        run: PYTHONPATH=apps/isp-network-health/src python -m unittest discover -s apps/isp-network-health/tests -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose syntax
        run: |
          cp .env.example .env
          ./scripts/bootstrap-secrets.sh
          docker network create docker
          docker compose config --quiet
