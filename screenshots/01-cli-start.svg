<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">INH CLI example screen</title>
  <desc id="desc">Demonstrative CLI screen using documentation IP ranges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#10253d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1030" cy="80" r="190" fill="#1f7a8c" opacity=".18"/>
  <circle cx="95" cy="610" r="220" fill="#e0a458" opacity=".10"/>
  <rect x="74" y="62" width="1052" height="552" rx="22" fill="#0c1726" filter="url(#shadow)" stroke="#25415f"/>
  <rect x="74" y="62" width="1052" height="48" rx="22" fill="#14243a"/>
  <circle cx="107" cy="86" r="7" fill="#ff5f56"/>
  <circle cx="132" cy="86" r="7" fill="#ffbd2e"/>
  <circle cx="157" cy="86" r="7" fill="#27c93f"/>
  <text x="600" y="94" text-anchor="middle" fill="#d9e7f2" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="700">INH - ISP Network Health</text>

  <text x="108" y="150" fill="#8bd3ff" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18">$ ./scripts/inh 203.0.113.0/28 --approach aggressive</text>
  <rect x="108" y="181" width="984" height="88" rx="12" fill="#101f33" stroke="#355777"/>
  <text x="132" y="215" fill="#ffffff" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="700">Target</text>
  <text x="132" y="246" fill="#b9cde0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17">203.0.113.0/28 | IPv4 CIDR block | 16 IPs | Workers: automatic</text>
  <text x="132" y="300" fill="#ffffff" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="700">Query Mode</text>
  <text x="132" y="331" fill="#b9cde0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17">Expanded mode (--approach aggressive) | Direct, network and informational sources</text>

  <rect x="108" y="365" width="984" height="78" rx="12" fill="#101f33" stroke="#355777"/>
  <text x="132" y="397" fill="#ffffff" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="700">Progress</text>
  <rect x="132" y="418" width="800" height="16" rx="8" fill="#20344d"/>
  <rect x="132" y="418" width="560" height="16" rx="8" fill="#28b5e5"/>
  <text x="954" y="434" fill="#b9cde0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15">70%</text>

  <rect x="108" y="475" width="472" height="88" rx="12" fill="#102b24" stroke="#28745d"/>
  <text x="132" y="509" fill="#ffffff" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="700">Positive Evidence</text>
  <text x="132" y="541" fill="#ffb4a8" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16">[LISTED] 203.0.113.14 | b.barracudacentral.org</text>

  <rect x="620" y="475" width="472" height="88" rx="12" fill="#2c230d" stroke="#8b6f16"/>
  <text x="644" y="509" fill="#ffffff" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="700">Recent Activity</text>
  <text x="644" y="541" fill="#ffd166" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16">Timeout: example.dnsbl.test for 203.0.113.7</text>
  <text x="108" y="595" fill="#7f93a8" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">Demonstration only. Uses RFC 5737 documentation IPs and synthetic blacklist evidence.</text>
</svg>
