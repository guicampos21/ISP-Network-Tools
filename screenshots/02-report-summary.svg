<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">INH HTML report executive summary</title>
  <desc id="desc">Demonstrative report summary using documentation IP ranges.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef5f7"/>
      <stop offset="100%" stop-color="#dce8ee"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a2d3a" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#page)"/>
  <rect x="66" y="44" width="1068" height="588" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="66" y="44" width="1068" height="132" rx="26" fill="#0d3b4c"/>
  <text x="108" y="102" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800">ISP - Network Health</text>
  <text x="108" y="138" fill="#b8dce8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18">Complete technical report | Target: 203.0.113.0/28 | Mode: Expanded</text>
  <rect x="923" y="78" width="158" height="48" rx="24" fill="#f28c38"/>
  <text x="1002" y="109" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="800">High Risk</text>

  <text x="108" y="220" fill="#102a43" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="800">Executive Summary</text>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="108" y="246" width="220" height="102" rx="16" fill="#f7fbfd" stroke="#d3e2ea"/>
    <text x="132" y="282" fill="#5b7083" font-size="15">Affected IPs</text>
    <text x="132" y="321" fill="#0d3b4c" font-size="34" font-weight="800">4 / 16</text>
    <rect x="354" y="246" width="220" height="102" rx="16" fill="#f7fbfd" stroke="#d3e2ea"/>
    <text x="378" y="282" fill="#5b7083" font-size="15">DNSBL Occurrences</text>
    <text x="378" y="321" fill="#0d3b4c" font-size="34" font-weight="800">8</text>
    <rect x="600" y="246" width="220" height="102" rx="16" fill="#f7fbfd" stroke="#d3e2ea"/>
    <text x="624" y="282" fill="#5b7083" font-size="15">Families</text>
    <text x="624" y="321" fill="#0d3b4c" font-size="34" font-weight="800">1</text>
    <rect x="846" y="246" width="220" height="102" rx="16" fill="#f7fbfd" stroke="#d3e2ea"/>
    <text x="870" y="282" fill="#5b7083" font-size="15">ASN-DROP</text>
    <text x="870" y="321" fill="#20744a" font-size="30" font-weight="800">Not listed</text>
  </g>

  <rect x="108" y="384" width="472" height="154" rx="18" fill="#fff8ed" stroke="#f1c27d"/>
  <text x="132" y="424" fill="#603b0b" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="800">Classification Reason</text>
  <text x="132" y="460" fill="#5f4a2d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">4 of 16 IPs have relevant direct hits.</text>
  <text x="132" y="488" fill="#5f4a2d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">Evidence is concentrated in one DNSBL family.</text>
  <text x="132" y="516" fill="#5f4a2d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">No ASN-DROP or network-scope listing was found.</text>

  <rect x="620" y="384" width="446" height="154" rx="18" fill="#eef9f5" stroke="#a9d9c8"/>
  <text x="644" y="424" fill="#114232" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="800">Recommended Actions</text>
  <text x="644" y="460" fill="#315f51" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">Validate SMTP logs and account abuse.</text>
  <text x="644" y="488" fill="#315f51" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">Review PTR/rDNS, SPF, DKIM and DMARC.</text>
  <text x="644" y="516" fill="#315f51" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">Request delist after remediation.</text>
  <text x="108" y="596" fill="#6b7c8c" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">Demonstration only. Uses RFC 5737 documentation IPs and synthetic blacklist evidence.</text>
</svg>
